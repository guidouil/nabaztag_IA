# mixerd owns the hardware levels; attenuate app playback independently.
</usr/share/alsa/alsa.conf>

pcm.nabaztag_mac {
    type plug
    slave.pcm {
        type softvol
        slave.pcm "hw:CARD=tagtagtagsound,DEV=0"
        control {
            name "Nabaztag IA"
            card "tagtagtagsound"
            count 2
        }
        min_dB -42.0
        max_dB 0.0
        resolution 101
    }
}
